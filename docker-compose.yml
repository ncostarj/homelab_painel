services:
  painel-nginx:
    image: nginx:alpine
    hostname: painel-nginx
    container_name: painel-nginx
    restart: unless-stopped
    working_dir: /var/www/html/painel
    volumes:
      - ./src:/var/www/html/painel
      - ./docker/nginx/painel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - painel-php    
    networks:
      - harbor-gateway
  painel-php:
    image: harbor/php:8.2-fpm
    hostname: painel-php
    container_name: painel-php
    working_dir: /var/www/html/painel
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html/painel
      - ~/.ssh:/home/harbor/.ssh:ro
    networks:
      harbor-gateway:
        aliases: 
          - painel.localhost
      harbor-data:
networks:
  harbor-gateway:
    external: true
  harbor-data:
    external: true

